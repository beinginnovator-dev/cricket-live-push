<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cricket Live Push</title>

  <meta
    name="description"
    content="Cricket Live Scoring and Live Match Viewer"
  >

  <meta
    http-equiv="refresh"
    content="0; url=/scorer/"
  >

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1020;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      padding: 30px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #b8c0d9;
    }

    a {
      display: inline-block;
      margin: 10px;
      padding: 12px 20px;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      text-decoration: none;
    }

    a.live {
      background: #16a34a;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🏏 Cricket Live Push</h1>

    <p>Opening Cricket Scorer...</p>

    <a href="/scorer/">
      Open Scorer
    </a>

    <a class="live" href="/live/">
      Open Live Score
    </a>

  </div>

</body>
</html>
