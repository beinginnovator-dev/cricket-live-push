<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <title>Cricket Scorer</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    body { font-family: system-ui; background:#0f172a; color:#f1f5f9; padding:16px; margin:0; }
    h1 { font-size:20px; margin-bottom:12px; }
    .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:320px; }
    button { padding:18px; font-size:20px; font-weight:700; border:none; border-radius:12px; background:#1e293b; color:#fff; cursor:pointer; }
    button:active { background:#334155; }
    .status { margin:12px 0; font-size:14px; color:#94a3b8; }
    .live { color:#4ade80; }
  </style>
</head>
<body>
  <h1>🏏 Scorer</h1>
  <div class="status" id="status">Connecting…</div>

  <div class="pad">
    <button onclick="sendBall(0,'0')">0</button>
    <button onclick="sendBall(1,'1')">1</button>
    <button onclick="sendBall(2,'2')">2</button>
    <button onclick="sendBall(3,'3')">3</button>
    <button onclick="sendBall(4,'FOUR')">4</button>
    <button onclick="sendBall(6,'SIX')">6</button>
    <button onclick="sendBall(0,'WICKET')" style="background:#7f1d1d;">W</button>
    <button onclick="sendBall(1,'WD')">Wd</button>
    <button onclick="sendBall(1,'NB')">Nb</button>
  </div>

  <p style="margin-top:24px;font-size:13px;color:#64748b;">
    Match ID: <strong id="match-label">default</strong><br/>
    Open Live page with same match id to see updates.
  </p>

  <script type="module">
    const params = new URLSearchParams(location.search);
    const matchId = params.get("match") || "default";
    document.getElementById("match-label").textContent = matchId;

    let ws;
    let reconnectDelay = 1000;

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws?match=${encodeURIComponent(matchId)}`);

      ws.onopen = () => {
        document.getElementById("status").textContent = "● Connected as Scorer";
        document.getElementById("status").className = "status live";
        reconnectDelay = 1000;
        ws.send(JSON.stringify({ type: "join", role: "scorer", name: "Scorer" }));
      };

      ws.onclose = () => {
        document.getElementById("status").textContent = "Reconnecting…";
        document.getElementById("status").className = "status";
        setTimeout(connect, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 1.5, 10000);
      };
    }

    window.sendBall = (runs, event) => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "ball", runs, event }));
      }
    };

    connect();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
