<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>Cricket Live Score</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/live.css" />
  <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f3cf.png" />
</head>
<body>
  <div class="header">
    <strong>🏏 Live Match</strong>
    <span id="conn-status" class="status">Connecting…</span>
  </div>

  <div class="score-card">
    <div id="score-main" class="score-main">0 / 0</div>
    <div id="score-overs" class="score-overs">(0.0)</div>
    <div class="teams">
      <span id="batting-team">Batting</span>
      <span id="bowling-team">Bowling</span>
    </div>
  </div>

  <div id="chase" class="chase" style="display:none;"></div>

  <div class="this-over" id="this-over">This over: –</div>

  <div id="anim-overlay"></div>

  <div class="viewers" id="viewer-count">– watching</div>

  <div class="chat-box" id="chat-box"></div>

  <div style="margin-top:16px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
    <button onclick="sendEmoji('🔥')">🔥</button>
    <button onclick="sendEmoji('👏')">👏</button>
    <button onclick="sendEmoji('❤️')">❤️</button>
    <button onclick="sendEmoji('⚡')">⚡</button>
  </div>

  <script type="module">
    import { LiveSocket } from "./js/ws-client.js";
    import { updateScore, playAnim, spawnEmoji, addChat, setStatus, setViewers } from "./js/render.js";

    // Get match id from URL ?match=xyz  (default = "default")
    const params = new URLSearchParams(location.search);
    const matchId = params.get("match") || "default";

    const socket = new LiveSocket({
      matchId,
      onStatus: setStatus,
      onMessage: (msg) => {
        if (msg.type === "welcome" || msg.type === "score") {
          updateScore(msg.state);
          setViewers(msg.viewers);
          if (msg.state?.lastEvent) {
            playAnim(msg.state.lastEvent.event);
          }
        }
        if (msg.type === "viewers") setViewers(msg.count);
        if (msg.type === "emoji") spawnEmoji(msg.emoji);
        if (msg.type === "chat") addChat(msg.from, msg.text);
      },
    });

    socket.connect();

    // Expose for buttons
    window.sendEmoji = (e) => socket.sendEmoji(e);

    // Register service worker for PWA
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
