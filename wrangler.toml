name = "cricket-live-push"
main = "worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Worker must run BEFORE static assets so /api/* is not swallowed by HTML files
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
html_handling = "none"

[[durable_objects.bindings]]
name = "LIVE_ROOM"
class_name = "LiveRoom"

# Declarative exports (required — this worker already used exports flow)
[exports.LiveRoom]
type = "durable-object"
storage = "sqlite"

# Tombstone: retire old demo class MatchDO that was provisioned earlier
[exports.MatchDO]
type = "durable-object"
state = "deleted"
